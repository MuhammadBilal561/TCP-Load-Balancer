
# -------------------------------------------------
# Backend 1
# -------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend1
  namespace: tcp-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend1
  template:
    metadata:
      labels:
        app: backend1
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: tcp-backend:1.0
          imagePullPolicy: IfNotPresent
          args: ["9001"]
          ports:
            - name: tcp
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: backend1
  namespace: tcp-lb
spec:
  type: ClusterIP
  selector:
    app: backend1
  ports:
    - name: tcp
      port: 9001
      targetPort: 9001
      protocol: TCP

---
