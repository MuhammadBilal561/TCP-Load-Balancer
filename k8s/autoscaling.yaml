
# -------------------------------------------------
# Load Balancer Autoscaling
# -------------------------------------------------

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tcp-load-balancer
  namespace: tcp-lb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tcp-load-balancer

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0

---
# -------------------------------------------------
# Backend 1 Autoscaling
# -------------------------------------------------

apiVersion: autoscaling/v2
